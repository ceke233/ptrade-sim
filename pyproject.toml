[project]
name = "ptrade-sim"
version = "0.2.0"
description = "PTrade 量化策略本地模拟回测平台（分钟级撮合 + 实时看板）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ceke233" }]
keywords = ["ptrade", "backtest", "quant", "trading", "A股"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy",
    # polars 是内部数据通路的主力（行情取数、指标计算、看板）
    "polars",
    # pandas **仅用于 PTrade API 边界**：官方规定 get_history / get_price /
    # get_fundamentals / get_market_* 返回 pandas，而策略普遍按 pandas 用法编写
    # （.reset_index/.set_index/.dt.strftime/布尔掩码索引），改为 polars 会破坏兼容性。
    # 内部通路不得使用 pandas（见 CONTRIBUTING.md「数据与契约」）。
    "pandas",
    "pyarrow",
    "loguru",
    "tqdm",
]

[project.optional-dependencies]
# 实时看板（`ptrade-sim dashboard` / `backtest` 自动拉起看板时需要）
dashboard = ["fastapi>=0.110", "uvicorn>=0.27"]
# DuckDB 数据源（引擎唯一数据源）+ `ptrade-sim db build/verify/normalize`
duckdb = ["duckdb>=1.5"]
# 更准的资源探查（系统 CPU 占用）；不装也可运行（内存走标准库探测）
perf = ["psutil>=5.9"]
# 开发（测试 / 静态检查 / 覆盖率）
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    # FastAPI TestClient 需要 httpx
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

# 测试/覆盖率全量：含看板与 DuckDB 依赖
all = [
    "ptrade-sim[dashboard,duckdb,perf,dev]",
]

[project.scripts]
ptrade-sim = "ptrade_sim.cli:main"

[project.urls]
Homepage = "https://github.com/ceke233/ptrade-sim"
Issues = "https://github.com/ceke233/ptrade-sim/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 包根目录。前端构建产物通过「复制进包目录」的方式随 wheel 分发：
#
#   web/dist  --复制-->  src/ptrade_sim/web/dist   （打包前，由 CI 执行）
#
# 复制目标正好命中 server.py `_web_dist_candidates()` 的第 2 条候选
# 「包目录 <包>/web/dist」，因此无需改动 server.py。
#
# 为什么不用 force-include（这是踩过的坑，别再改回去）：
#   hatchling 的 force-include 在源路径不存在时直接抛
#   `FileNotFoundError: Forced include not found`
#   （hatchling/builders/plugin/interface.py::recurse_forced_files），
#   而 **editable 安装同样会走这条路径**
#   （hatchling/builders/wheel.py::build_editable_detection 末尾也调用
#   recurse_forced_files）。`web/dist` 被 .gitignore 排除、全新检出时不存在，
#   于是 `pip install -e ".[dev]"` 会直接失败 —— 代价远大于收益。
#
# 为什么必须写 ignore-vcs = true：
#   仓库根 .gitignore 第 7 行是 `dist/`。git 的规则里「末尾斜杠」**不代表锚定**
#   （只有开头或中间出现斜杠才锚定到该 .gitignore 所在目录），所以 `dist/`
#   会匹配任意层级的 dist 目录 —— 也包括我们刚复制出来的
#   `src/ptrade_sim/web/dist/`。hatchling 会通过
#   BuilderConfig.load_vcs_exclusion_patterns() 读取根 .gitignore 作为排除规则，
#   结果就是复制进去的前端被静默丢掉（实测 wheel 里 0 个前端文件）。
#   关闭 VCS 排除后，wheel 只按 packages=["src/ptrade_sim"] 收集文件，
#   范围本来就很小，不会被 .gitignore 想挡的 node_modules / data / *.duckdb
#   之类影响（它们都不在 src/ptrade_sim 下）；__pycache__ 仍由
#   hatchling 的 EXCLUDED_DIRECTORIES 排除。
#
# 注意：sdist 目标**不**关 VCS 排除（否则 include 里的 `web/**` 会把
# node_modules 一起打进 sdist）。因此 sdist 不含构建好的前端，它的定位仍是
# 「源码 + 前端源码，用户自行 pnpm build」（见下方 sdist 注释）。
# 打包顺序见 .github/workflows/ci.yml 的 build job：
#   1) cd web && pnpm install --frozen-lockfile && pnpm run build
#   2) 把 web/dist 复制到 src/ptrade_sim/web/dist
#   3) python -m build --wheel   （必须从源码树构建，见下）
#   4) python -m build --sdist
#   5) 断言 wheel 里含 ptrade_sim/web/dist/index.html
#
# ⚠️ 必须用 `--wheel` 单独构建：`python -m build`（默认 sdist+wheel）会
# **先从 sdist 再构建 wheel**，而 sdist 不含前端 → 产物又是没有看板的 wheel。
packages = ["src/ptrade_sim"]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
# 说明：sdist 打包可运行源码 + 前端源码（node_modules/dist 由 .gitignore 排除），
# 便于从 sdist 自行 `cd web && pnpm install && pnpm build`。
include = [
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "config.example.json",
    # 策略目录形态：examples/<name>/{strategy.py,strategy_config.json}
    "examples/**/*.py",
    "examples/**/*.json",
    "docs/*.md",
    "src/ptrade_sim",
    "tests/**",
    "web/**",
]

# ============================================================
# 测试
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `--strict-markers`：拼错 marker 直接报错，避免静默跳过
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: 纯逻辑单测（快，无 IO）",
    "integration: 需要合成 DuckDB 夹具的端到端测试",
    "slow: 较慢（分钟级回测等）",
]
filterwarnings = [
    "error::DeprecationWarning:ptrade_sim.*",
    "ignore::DeprecationWarning:pandas.*",
    "ignore::DeprecationWarning:polars.*",
]

[tool.coverage.run]
source = ["ptrade_sim"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
# 只报「代码行是否被执行」，不追求 100%；低于阈值 CI 失败
# 全局门槛（每模块下限另由 scripts/check_coverage.py 强制）：
# 全局达标会掩盖局部裸奔 —— cache 92% 的余量足以盖住 dbtools 58%。
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]

# ============================================================
# 静态检查（ruff：lint + format）
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = ["dist", "web", "docs", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "RET",       # flake8-return
    "PTH",       # flake8-use-pathlib
    "RUF",       # ruff 专有
]
ignore = [
    "E501",      # 行长由 formatter 决定
    "B008",      # 允许函数默认值调用（PTrade API 风格需要）
    "SIM108",    # 三元表达式并非总是更清晰
    "RUF001", "RUF002", "RUF003",  # 中文全角标点在注释/字符串中是有意的
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
# runtime.py 是 PTrade API 适配层：大量函数名/参数名由官方签名决定
"src/ptrade_sim/runtime.py" = ["N803", "N806"]
# NamedTuple 的字段默认值（rename={} / derive={} 等）被 RUF012 误报为
# 「可变类属性」；NamedTuple 字段是逐实例的且运行期不可变，属误报。
"src/ptrade_sim/data_contract.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["ptrade_sim"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# 类型检查（mypy）
# ============================================================
[tool.mypy]
# ⚠️ 与 `requires-python` 的差异是有意的：
#   运行下限是 3.10（见 requires-python），但 **类型检查目标** 定在 3.12 ——
#   numpy 2.x 的 `.pyi` 使用 PEP 695 `type` 语句（需 ≥3.12），
#   若按 3.10 解析，mypy 会直接语法报错并中止整个检查。
python_version = "3.12"
files = ["src/ptrade_sim"]
# 渐进式：先保证「不引入新错误」，不追求一次性全量标注
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# 不解析第三方库的 stub：numpy 2.x 的 .pyi 使用 PEP 695 `type` 语句（需 Python ≥3.12），
# 在本项目声明的 3.10 目标下会让 mypy 直接语法报错并中止整个检查。
# 这些库也不提供稳定类型契约，跳过其内部检查、只检查本项目代码。
module = [
    "numpy.*", "pandas.*", "polars.*", "pyarrow.*",
    "duckdb.*", "loguru.*", "tqdm.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
# 引擎是动态执行策略代码的，类型标注收益低、噪声大 → 只做语法级检查
module = ["ptrade_sim.runtime"]
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
