[project]
name = "ptrade-sim"
version = "0.1.0"
description = "PTrade 量化策略本地模拟回测平台（分钟级撮合）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ceke233" }]
keywords = ["ptrade", "backtest", "quant", "trading", "A股"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "loguru",
    "tqdm",
    "matplotlib",
]

[project.scripts]
ptrade-sim = "ptrade_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptrade_sim"]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "sample_data/*.csv",
    "config.example.json",
]
